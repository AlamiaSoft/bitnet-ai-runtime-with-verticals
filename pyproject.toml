[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-ai-runtime"
version = "0.1.0"
description = "Local AI Agent Runtime powered by 1-bit and Edge Inference with Business Verticals"
authors = [{name = "AlamiaSoft"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
playwright = [
    "playwright>=1.41.0",
]
llamacpp = [
    "llama-cpp-python>=0.2.56",
]

[project.scripts]
bitnet-runtime = "bitnet_runtime.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
