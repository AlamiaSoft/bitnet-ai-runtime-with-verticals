<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alamia · Local AI Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ============================================================
   THEME TOKENS — derived from AlamiaAI.com design.md
   One semantic variable set; Light / Dark / System all read
   from the same names so every component stays in sync.
   ============================================================ */
:root{
  --bg:#FFFFFF;
  --bg-alt:#F8FAFC;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --surface-3:#F1F5F9;
  --border:#E2E8F0;
  --border-strong:#475569;
  --text:#0F172A;
  --text-dim:#475569;
  --text-faint:#64748B;
  --accent:#2563EB;
  --accent-hover:#1D4ED8;
  --accent-wash:rgba(37,99,235,.08);
  --success:#10B981;
  --success-wash:rgba(16,185,129,.10);
  --warning:#F59E0B;
  --warning-wash:rgba(245,158,11,.10);
  --danger:#EF4444;
  --danger-wash:rgba(239,68,68,.10);
  --radius-sm:8px;
  --radius-lg:12px;
  --shadow-subtle:0 1px 3px 0 rgba(15,23,42,.06),0 1px 2px -1px rgba(15,23,42,.06);
  --shadow-card:0 4px 6px -1px rgba(15,23,42,.06),0 2px 4px -2px rgba(15,23,42,.05);
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0F172A;
    --bg-alt:#0B1220;
    --surface:#1E293B;
    --surface-2:#27324A;
    --surface-3:#2F3B57;
    --border:rgba(226,232,240,.12);
    --border-strong:#64748B;
    --text:#F1F5F9;
    --text-dim:#94A3B8;
    --text-faint:#7284A0;
    --accent-wash:rgba(37,99,235,.16);
    --success-wash:rgba(16,185,129,.14);
    --warning-wash:rgba(245,158,11,.14);
    --danger-wash:rgba(239,68,68,.14);
    --shadow-subtle:0 1px 3px 0 rgba(0,0,0,.24),0 1px 2px -1px rgba(0,0,0,.2);
    --shadow-card:0 4px 10px -2px rgba(0,0,0,.35),0 2px 4px -2px rgba(0,0,0,.25);
  }
}
[data-theme="dark"]{
  --bg:#0F172A;
  --bg-alt:#0B1220;
  --surface:#1E293B;
  --surface-2:#27324A;
  --surface-3:#2F3B57;
  --border:rgba(226,232,240,.12);
  --border-strong:#64748B;
  --text:#F1F5F9;
  --text-dim:#94A3B8;
  --text-faint:#7284A0;
  --accent-wash:rgba(37,99,235,.16);
  --success-wash:rgba(16,185,129,.14);
  --warning-wash:rgba(245,158,11,.14);
  --danger-wash:rgba(239,68,68,.14);
  --shadow-subtle:0 1px 3px 0 rgba(0,0,0,.24),0 1px 2px -1px rgba(0,0,0,.2);
  --shadow-card:0 4px 10px -2px rgba(0,0,0,.35),0 2px 4px -2px rgba(0,0,0,.25);
}
[data-theme="light"]{
  --bg:#FFFFFF; --bg-alt:#F8FAFC; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#F1F5F9;
  --border:#E2E8F0; --border-strong:#475569; --text:#0F172A; --text-dim:#475569; --text-faint:#64748B;
  --accent-wash:rgba(37,99,235,.08); --success-wash:rgba(16,185,129,.10);
  --warning-wash:rgba(245,158,11,.10); --danger-wash:rgba(239,68,68,.10);
  --shadow-subtle:0 1px 3px 0 rgba(15,23,42,.06),0 1px 2px -1px rgba(15,23,42,.06);
  --shadow-card:0 4px 6px -1px rgba(15,23,42,.06),0 2px 4px -2px rgba(15,23,42,.05);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{transition:background .15s ease;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .15s ease,color .15s ease;
}
::selection{background:var(--accent-wash);color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;opacity:.4;}
::-webkit-scrollbar-track{background:transparent;}

a,button{font-family:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:224px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:background .15s ease,border-color .15s ease;
}
.brand{
  padding:22px 20px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px;
}
.brand-mark{
  width:26px;height:26px;border-radius:7px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:14px;height:14px;color:#fff;}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.2px;}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;margin-top:1px;}

.nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13px;font-weight:500;text-align:left;width:100%;
  transition:background .12s,color .12s;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-wash);color:var(--accent);}
.nav-item.active svg{opacity:1;}

.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);}
.health-row{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;}
.dot.pulse{animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;flex-shrink:0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;background:var(--bg);
  position:sticky;top:0;z-index:5;
  transition:background .15s ease,border-color .15s ease;
}
.crumb{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);letter-spacing:.4px;}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-top:1px;}
.top-right{display:flex;align-items:center;gap:14px;}

.theme-switch{
  display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:2px;gap:1px;
}
.theme-switch button{
  padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--text-faint);
  display:flex;align-items:center;gap:5px;transition:background .12s,color .12s;
}
.theme-switch button svg{width:13px;height:13px;}
.theme-switch button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-subtle);}

.badge{
  font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;gap:6px;
}
.badge.good{border-color:var(--success);color:var(--success);background:var(--success-wash);}

.content{padding:28px;flex:1;}
.page{display:none;}
.page.active{display:block;}

h1.h{font-size:15px;font-weight:600;margin-bottom:2px;letter-spacing:-.1px;}
.section-lede{color:var(--text-dim);font-size:13.5px;margin-bottom:20px;max-width:640px;}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}

/* ---------- Grid / Cards ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;
  box-shadow:var(--shadow-card);
  transition:background .15s ease,border-color .15s ease;
}
.stat-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.4px;}
.stat-sub{font-size:11.5px;color:var(--text-dim);margin-top:5px;font-family:var(--font-mono);}

/* ---------- Buttons ---------- */
.btn{
  font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  color:var(--text-dim);transition:all .15s ease;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff;}
.btn-ghost{border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);background:var(--danger-wash);color:var(--danger);}
.btn-sm{padding:6px 11px;font-size:11.5px;}

/* ---------- Status / tags ---------- */
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;}
.status .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status.loaded .d{background:var(--success);}
.status.loaded{color:var(--success);}
.status.available .d{background:transparent;border:1.5px solid var(--text-faint);}
.status.available{color:var(--text-dim);}
.status.notinstalled .d{background:var(--text-faint);opacity:.5;}
.status.notinstalled{color:var(--text-faint);}
.status.paused .d{background:var(--warning);}
.status.paused{color:var(--warning);}

.tag{
  font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:6px;
  background:var(--surface-3);color:var(--text-dim);letter-spacing:.2px;font-weight:500;
}

/* ---------- Live-decision motif (signature, reused everywhere) ----------
   Flat schematic: one accent line, one accent node, everything else quiet.
   No glow. No color variety. Same shape wherever the system is "deciding". */
.trace-wrap{
  position:relative;border-radius:var(--radius-lg);background:var(--surface-2);
  border:1px solid var(--border);padding:18px 22px 12px;
}
.trace-wrap svg{width:100%;height:auto;display:block;}
.trace-dash{stroke-dasharray:4 6;animation:dashmove 1.8s linear infinite;}
@keyframes dashmove{to{stroke-dashoffset:-20;}}
.trace-node-live{animation:nodepulse 2.4s ease-in-out infinite;}
@keyframes nodepulse{0%,100%{opacity:1;}50%{opacity:.5;}}

.trace-log{margin-top:14px;display:flex;flex-direction:column;}
.trace-row{
  display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:12px;
}
.trace-row:last-child{border-bottom:none;}
.trace-time{font-family:var(--font-mono);color:var(--text-faint);font-size:10.5px;}
.trace-desc b{font-weight:600;}
.trace-score{font-family:var(--font-mono);color:var(--accent);font-size:11px;font-weight:500;}

.ask-row{
  margin-top:16px;display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 6px 6px 14px;align-items:center;box-shadow:var(--shadow-subtle);
}
.ask-row input{flex:1;background:none;border:none;color:var(--text);font-family:var(--font-sans);font-size:13px;}
.ask-row input::placeholder{color:var(--text-faint);}
.ask-row input:focus{outline:none;}

/* ---------- Model cards ---------- */
.model-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;
  cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;box-shadow:var(--shadow-card);
}
.model-card:hover{border-color:var(--accent);}
.mc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.mc-name{font-weight:600;font-size:14.5px;}
.mc-tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 14px;}
.qbar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px;color:var(--text-dim);font-family:var(--font-mono);}
.qbar{flex:1;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;}
.qbar-fill{height:100%;background:var(--accent);border-radius:3px;}
.mc-meta{display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:16px;}
.mc-foot{display:flex;justify-content:space-between;align-items:center;}

.filter-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.search-box{
  flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-subtle);
}
.search-box input{background:none;border:none;color:var(--text);font-size:13px;flex:1;}
.search-box input:focus{outline:none;}
.search-box svg{width:14px;height:14px;color:var(--text-faint);flex-shrink:0;}
.chip{
  padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:12px;color:var(--text-dim);
  font-weight:500;white-space:nowrap;background:var(--surface);
}
.chip.active{background:var(--accent-wash);border-color:var(--accent);color:var(--accent);}

/* ---------- Back link ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;margin-bottom:18px;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:13px;height:13px;}

/* ---------- Detail layout ---------- */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
.detail-title{font-size:23px;font-weight:700;letter-spacing:-.3px;}
.detail-sub{color:var(--text-dim);font-size:13.5px;margin-top:5px;max-width:520px;}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-faint);padding:0 10px 10px 0;font-weight:500;border-bottom:1px solid var(--border);
}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
tr:last-child td{border-bottom:none;}
.num{font-family:var(--font-mono);color:var(--text-dim);}

.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.kv:last-child{border-bottom:none;}
.kv span:first-child{color:var(--text-dim);}
.kv span:last-child{font-family:var(--font-mono);font-weight:500;}

.details-toggle{
  margin-top:16px;font-family:var(--font-mono);font-size:11px;color:var(--accent);
  display:flex;align-items:center;gap:6px;
}
.tech-panel{
  display:none;margin-top:10px;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 15px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);line-height:1.9;
}
.tech-panel.open{display:block;}

/* ---------- Toggle switch ---------- */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-label{font-size:13px;font-weight:500;}
.toggle-desc{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.switch{width:36px;height:20px;border-radius:10px;background:var(--surface-3);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .15s;}
.switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch.on::after{transform:translateX(16px);}

/* ---------- Playground ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:10px 14px;font-size:12.5px;font-weight:500;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--accent);border-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}

.chat-frame{display:flex;flex-direction:column;height:460px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-card);}
.chat-strategy{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:72%;padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.6;}
.msg.user{align-self:flex-end;background:var(--accent-wash);border:1px solid var(--accent);color:var(--text);border-bottom-right-radius:3px;}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:3px;}
.msg-meta{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:6px;}
.chat-input-row{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px;}
.chat-input-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:13px;}
.chat-input-row input:focus{outline:none;border-color:var(--accent);}

/* ---------- Employees ---------- */
.emp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;box-shadow:var(--shadow-card);transition:border-color .15s ease;}
.emp-card:hover{border-color:var(--accent);}
.emp-icon{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--accent-wash);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.emp-icon svg{width:18px;height:18px;color:var(--accent);}
.emp-name{font-weight:600;font-size:15px;margin-bottom:3px;}
.emp-role{font-size:12px;color:var(--text-dim);margin-bottom:16px;}

.list-plain{display:flex;flex-direction:column;}
.list-plain li{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.list-plain li:last-child{border-bottom:none;}

/* ---------- Workflows ---------- */
.wf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow-card);}
.wf-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.wf-name{font-weight:600;font-size:14px;}
.wf-trigger{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:3px;}
.wf-steps{display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.wf-step{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:7px 12px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);white-space:nowrap;}
.wf-step .idx{font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:10.5px;}
.wf-arrow{color:var(--text-faint);padding:0 8px;font-size:12px;flex-shrink:0;}

/* ---------- Activity ---------- */
.act-row{display:grid;grid-template-columns:88px 100px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.act-row:last-child{border-bottom:none;}
.act-time{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
.act-desc{font-size:12.5px;}
.act-desc b{font-weight:600;}
.act-detail{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

/* ---------- System ---------- */
.usage-bar{height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin:9px 0 5px;}
.usage-fill{height:100%;background:var(--accent);}

<script>
/* ============================= THEME ============================= */
const THEME_ICONS = {
  system:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,
  light:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`,
  dark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>`,
};
let themePref = 'system';
function applyTheme(){
  if(themePref==='system'){ document.documentElement.removeAttribute('data-theme'); }
  else{ document.documentElement.setAttribute('data-theme', themePref); }
  renderThemeSwitch();
}
function renderThemeSwitch(){
  const el = document.getElementById('themeSwitch');
  el.innerHTML = ['system','light','dark'].map(t=>`
    <button class="${themePref===t?'active':''}" data-theme-choice="${t}" aria-label="${t} theme">
      ${THEME_ICONS[t]}<span style="text-transform:capitalize;">${t}</span>
    </button>`).join('');
  el.querySelectorAll('[data-theme-choice]').forEach(b=>{
    b.onclick = ()=>{ themePref = b.dataset.themeChoice; applyTheme(); };
  });
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(themePref==='system') applyTheme(); });
applyTheme();

/* ============================= ICONS ============================= */

  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`,
  chevron:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
  mail:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
  brain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-1 5.8V15a3 3 0 0 0 3 3h.5"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 1 5.8V15a3 3 0 0 1-3 3h-.5M9 4v16M15 4v16"/></svg>`

  {id:'reranker', name:'BGE Reranker Base', engine:'TEI', tags:['Reranking'], ram:0.4, speed:90, quality:4.0, status:'not-installed',

const BENCH = {
  bitnet:[4.0,3.7,3.5,37,1.1], qwen:[4.5,4.2,4.1,32,1.4], phi:[4.3,4.4,4.3,18,2.4], gemma:[4.1,4.0,3.8,24,2.0]
};

const EMPLOYEES = [
  {id:'inbox', name:'AI Employee', role:'Email + Files + Calendar', icon:'mail',
   tools:['Email','Filesystem','Calendar'], memory:'Episodic + Semantic',
   permissions:[['Read email','allow'],['Draft replies before sending','ask'],['Read files in workspace','allow'],['Delete files','deny']],
   workflows:['Daily inbox triage','Meeting prep']},

   steps:['Fetch unread email','Classify priority \u00b7 Qwen 2.5','Draft replies \u00b7 ask first','Log to Activity']},

  {t:'09:40:55', kind:'Employee', desc:'<b>AI Employee</b> triaged 6 unread messages', meta:'2 flagged'},
  {t:'09:22:10', kind:'Model', desc:'<b>BGE Small</b> loaded into memory', meta:'0.3 GB'},

/* ============================= NAV ============================= */
const PAGES = [
  {id:'overview', label:'Overview', icon:'grid'},
  {id:'garden', label:'Model Garden', icon:'layers'},
  {id:'router', label:'AI Router', icon:'route'},
  {id:'playground', label:'Playground', icon:'terminal'},
  {id:'employees', label:'AI Employees', icon:'users'},
  {id:'workflows', label:'Workflows', icon:'workflow'},
  {id:'activity', label:'Activity', icon:'activity'},
  {id:'system', label:'System', icon:'cpu'},
];

let state = {page:'overview', modelId:null, employeeId:null, gardenFilter:'All', gardenQuery:'', tab:'Chat'};

function renderNav(){
  document.getElementById('nav').innerHTML = PAGES.map(p=>`
    <button class="nav-item ${state.page===p.id?'active':''}" data-nav="${p.id}">
      ${icon(p.icon)}<span>${p.label}</span>
    </button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick = ()=>navigate(el.dataset.nav); });
}

function navigate(page, param){
  state.page = page;
  if(page==='model-detail') state.modelId = param;
  if(page==='employee-detail') state.employeeId = param;
  render();
  window.scrollTo(0,0);
}
function setCrumb(trail, title){
  document.getElementById('crumb').textContent = trail;
  document.getElementById('pageTitle').textContent = title;
}

/* ============================= RENDERERS ============================= */
function render(){
  renderNav();
  const c = document.getElementById('content');
  if(state.page==='overview') return renderOverview(c);
  if(state.page==='garden') return renderGarden(c);
  if(state.page==='model-detail') return renderModelDetail(c);
  if(state.page==='router') return renderRouter(c);
  if(state.page==='playground') return renderPlayground(c);
  if(state.page==='employees') return renderEmployees(c);
  if(state.page==='employee-detail') return renderEmployeeDetail(c);
  if(state.page==='workflows') return renderWorkflows(c);
  if(state.page==='activity') return renderActivityPage(c);
  if(state.page==='system') return renderSystem(c);
}

/* ---- Overview ---- */
function renderOverview(c){
  setCrumb('ALAMIA / OVERVIEW','Overview');

      <div class="card"><div class="stat-label">Models installed</div><div class="stat-value">5</div><div class="stat-sub">2 more available in the Garden</div></div>

      <div class="card"><div class="stat-label">Memory in use</div><div class="stat-value">24.1 <span style="font-size:15px;color:var(--text-dim);font-weight:600;">GB</span></div><div class="stat-sub">of 64 GB host RAM</div></div>
      <div class="card"><div class="stat-label">Inference mode</div><div class="stat-value" style="font-size:20px;">CPU-only</div><div class="stat-sub">Cloud escalation off</div></div>

    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">

      ${routerTraceSVG()}
      <div class="ask-row">

    </div>

    <div class="eyebrow" style="margin-top:24px;">Model Garden</div>

      ${MODELS.slice(0,3).map(modelCardHTML).join('')}
    </div>
    <div style="margin-top:14px;"><button class="btn btn-ghost btn-sm" data-nav="garden">View all models \u2192</button></div>
  `;
  bindLocalNav(c);
  bindModelCards(c);
}

/* ---- Signature "live decision" motif — reused on Overview + Router, unchanged ---- */

/* ---- Model Garden ---- */
function modelCardHTML(m){
  const statusClass = m.status==='loaded'?'loaded':m.status==='available'?'available':'notinstalled';
  const statusLabel = m.status==='loaded'?'Loaded':m.status==='available'?'Ready to load':'Not installed';
  const actionBtn = m.status==='loaded' ? `<button class="btn btn-sm" data-unload="${m.id}">Unload</button>`
    : m.status==='available' ? `<button class="btn btn-primary btn-sm" data-load="${m.id}">Load</button>`
    : `<button class="btn btn-primary btn-sm" data-install="${m.id}">Install</button>`;
  return `
    <div class="model-card" data-model="${m.id}">
      <div class="mc-head">
        <div class="mc-name">${m.name}</div>
        <div class="status ${statusClass}"><span class="d"></span>${statusLabel}</div>
      </div>
      <div class="mc-tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="qbar-row"><span>Quality</span><div class="qbar"><div class="qbar-fill" style="width:${m.quality/5*100}%"></div></div><span>${m.quality.toFixed(1)}</span></div>
      <div class="mc-meta"><span>RAM ${m.ram} GB</span><span>${m.speed} tok/s</span></div>
      <div class="mc-foot">
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);">${m.engine}</span>
        ${actionBtn}
      </div>
    </div>`;
}

function renderGarden(c){
  setCrumb('ALAMIA / MODEL GARDEN','Model Garden');
  const cats = ['All','Generation','Embedding','Reasoning','Coding'];
  const catMap = {Generation:['Extraction','RAG'], Reasoning:['Reasoning'], Coding:['Coding'], Embedding:['Embedding','Reranking']};
  let filtered = MODELS.filter(m=>{
    const matchesQuery = m.name.toLowerCase().includes(state.gardenQuery.toLowerCase());
    const matchesCat = state.gardenFilter==='All' || m.tags.some(t=>(catMap[state.gardenFilter]||[]).includes(t));
    return matchesQuery && matchesCat;
  });
  c.innerHTML = `
    <div class="section-lede">Discover, compare, and manage the models running on this machine. Everything here runs locally on your CPU.</div>
    <div class="filter-row">
      <div class="search-box">${icon('search')}<input id="gardenSearch" type="text" placeholder="Search models..." value="${state.gardenQuery}"/></div>
      ${cats.map(cat=>`<button class="chip ${state.gardenFilter===cat?'active':''}" data-cat="${cat}">${cat}</button>`).join('')}
    </div>
    <div class="grid grid-3" id="gardenGrid">
      ${filtered.map(modelCardHTML).join('') || `<div class="card" style="grid-column:1/-1;color:var(--text-dim);">No models match that search.</div>`}
    </div>
  `;
  c.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.gardenFilter=el.dataset.cat; renderGarden(c);});
  const search = document.getElementById('gardenSearch');
  search.oninput = ()=>{state.gardenQuery = search.value; renderGarden(c); document.getElementById('gardenSearch').focus();};
  bindModelCards(c);
}

function bindModelCards(root){
  root.querySelectorAll('[data-model]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target.closest('button')) return; navigate('model-detail', el.dataset.model); });
  });
  root.querySelectorAll('[data-install],[data-load],[data-unload]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.install||btn.dataset.load||btn.dataset.unload;
      const m = MODELS.find(x=>x.id===id);
      if(btn.dataset.install){ m.status='available'; btn.textContent='Installing\u2026'; setTimeout(()=>render(),650); }
      if(btn.dataset.load){ m.status='loaded'; render(); }
      if(btn.dataset.unload){ m.status='available'; render(); }
    });
  });
  root.querySelectorAll('[data-nav]').forEach(el=>{ if(!el.onclick) el.onclick=()=>navigate(el.dataset.nav); });
}
function bindLocalNav(root){ root.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick=()=>navigate(el.dataset.nav); }); }

/* ---- Model Detail ---- */
function renderModelDetail(c){

        <div class="detail-sub">${m.desc}</div>

    </div>

    <div class="two-col">
      <div class="card">
        <div class="eyebrow">Benchmark results</div>
        ${bench ? `
        <table>
          <tr><th>Model</th>${BENCH_COLS.map(h=>`<th>${h}</th>`).join('')}</tr>
          ${Object.keys(BENCH).map(id=>{
            const row = BENCH[id]; const name = MODELS.find(x=>x.id===id).name;
            const isSelf = id===m.id;
            return `<tr style="${isSelf?'background:var(--accent-wash);':''}"><td style="${isSelf?'color:var(--accent);font-weight:600;':''}">${name}</td>${row.map(v=>`<td class="num">${v}</td>`).join('')}</tr>`;
          }).join('')}
        </table>` : `<div style="color:var(--text-dim);font-size:12.5px;">Benchmark data not available for embedding models \u2014 evaluated on retrieval accuracy instead.</div>
        <table style="margin-top:12px;">
          <tr><th>Metric</th><th>Score</th></tr>
          <tr><td>Retrieval accuracy</td><td class="num">${(m.quality/5*100).toFixed(0)}%</td></tr>
          <tr><td>Throughput</td><td class="num">${m.speed} emb/s</td></tr>
        </table>`}
        <button class="details-toggle" id="techToggle">${icon('chevron')} Technical execution details</button>
        <div class="tech-panel" id="techPanel">
          engine.driver &nbsp; = ${m.engine}<br/>
          engine.backend &nbsp;= ${m.id==='bitnet' ? 'BitNetBackend (native ternary sidecar)' : m.engine==='TEI' ? 'TEIBackend (batch embeddings)' : 'LlamaCppBackend (llama-server)'}<br/>
          lifecycle.state = ${m.status.toUpperCase()}<br/>
          weights.path &nbsp;&nbsp;= ./models/${m.id}/
        </div>
      </div>

      <div class="card">
        <div class="eyebrow">Hardware requirements</div>
        <div class="kv"><span>RAM required</span><span>${m.ram} GB</span></div>
        <div class="kv"><span>Recommended CPU</span><span>AVX2 or better</span></div>
        <div class="kv"><span>Disk footprint</span><span>${(m.ram*0.9).toFixed(1)} GB</span></div>
        <div class="kv"><span>Throughput</span><span>${m.speed} tok/s</span></div>
        <div class="eyebrow" style="margin-top:20px;">Execution status</div>
        <div class="kv"><span>State</span><span class="status ${m.status==='loaded'?'loaded':m.status==='available'?'available':'notinstalled'}"><span class="d"></span>${m.status==='loaded'?'Loaded':m.status==='available'?'Ready to load':'Not installed'}</span></div>
        <div class="kv"><span>Used by</span><span>${m.status==='loaded' ? 'AI Router \u00b7 Playground' : '\u2014'}</span></div>
      </div>
    </div>
  `;
  bindLocalNav(c);
  bindModelCards(c);
  document.getElementById('techToggle').onclick = ()=>document.getElementById('techPanel').classList.toggle('open');
}

/* ---- Playground ---- */
function renderPlayground(c){
  setCrumb('ALAMIA / PLAYGROUND','AI Playground');
  const tabs = ['Chat','Extract','Embed','RAG','Classify','Code','Compare'];
  c.innerHTML = `
    <div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div>
    <div id="tabBody"></div>
  `;
  c.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab; renderPlayground(c);});
  const body = document.getElementById('tabBody');
  if(state.tab==='Compare'){
    body.innerHTML = `
      <div class="card">
        <div class="eyebrow">Model comparison</div>
        <table>
          <tr><th>Metric</th>${['qwen','bitnet','phi'].map(id=>`<th>${MODELS.find(m=>m.id===id).name}</th>`).join('')}</tr>
          ${BENCH_COLS.map((col,i)=>`<tr><td>${col}</td>${['qwen','bitnet','phi'].map(id=>`<td class="num">${BENCH[id][i]}</td>`).join('')}</tr>`).join('')}
        </table>
        <div style="font-size:11.5px;color:var(--text-dim);margin-top:14px;">This is what the Router sees when it scores a candidate \u2014 nothing is hidden.</div>
      </div>`;
  } else if(state.tab==='Chat'){
    body.innerHTML = `
      <div class="chat-frame">
        <div class="chat-strategy">
          <span style="font-size:12.5px;font-weight:500;">Model strategy: <span style="color:var(--accent);">Automatic</span></span>
          <button class="details-toggle" id="stratToggle" style="margin-top:0;">${icon('chevron')} Technical view</button>
        </div>
        <div class="tech-panel" id="stratPanel" style="margin:0;border-radius:0;border-left:none;border-right:none;">selected_model = Qwen 2.5 1.5B &nbsp; via LlamaCppBackend &nbsp; (score 0.94, RAG capability match)</div>
        <div class="chat-body">
          <div class="msg user">Summarize the attached Q3 report in three bullet points.</div>
          <div class="msg ai">\u2022 Revenue up 12% quarter over quarter, driven by the local-AI product line.<br/>\u2022 Gross margin held steady at 61%.<br/>\u2022 Hiring plan for Q4 delayed pending runway review.<div class="msg-meta">Qwen 2.5 1.5B \u00b7 0.6s \u00b7 local</div></div>
          <div class="msg user">Turn that into a short email to the team.</div>
          <div class="msg ai">Draft ready \u2014 want me to open it in your AI Employee's Email tool?<div class="msg-meta">Qwen 2.5 1.5B \u00b7 0.4s \u00b7 local</div></div>
        </div>
        <div class="chat-input-row"><input type="text" placeholder="Ask anything\u2026"/><button class="btn btn-primary btn-sm">Send</button></div>
      </div>`;
    document.getElementById('stratToggle').onclick=()=>document.getElementById('stratPanel').classList.toggle('open');
  } else {
    body.innerHTML = `<div class="card" style="color:var(--text-dim);">
      <div class="eyebrow">${state.tab}</div>
      ${state.tab} workspace \u2014 pick a model or leave it on Automatic, drop in your input, and run it locally. Results and confidence scores appear inline.
      <div class="ask-row" style="margin-top:16px;"><input type="text" placeholder="Input for ${state.tab.toLowerCase()}\u2026"/><button class="btn btn-primary btn-sm">Run</button></div>
    </div>`;
  }
}
