<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alamia · Local AI Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0A0D0B;
  --surface:#12160F;
  --surface-2:#181D14;
  --surface-3:#1E241A;
  --border:#242B1F;
  --border-soft:#1A2016;
  --accent:#B7E24A;
  --accent-dim:#6E8A34;
  --accent-glow:rgba(183,226,74,.13);
  --text:#E8ECE1;
  --text-dim:#93998A;
  --text-faint:#5A6153;
  --warn:#E0B34D;
  --danger:#E2664D;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-glow);color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

a,button{font-family:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:220px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 18px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:9px;
}
.brand-mark{
  width:9px;height:9px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);flex-shrink:0;
}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:15.5px;letter-spacing:.2px;}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;margin-top:1px;}

.nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;
  color:var(--text-dim);font-size:13px;font-weight:500;text-align:left;width:100%;
  transition:background .12s,color .12s;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.8;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-glow);color:var(--accent);}
.nav-item.active svg{opacity:1;}

.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border-soft);}
.health-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-dim);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.dot.pulse{animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--accent-glow);}50%{opacity:.6;box-shadow:0 0 0 4px transparent;}}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:58px;flex-shrink:0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;background:rgba(10,13,11,.7);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:5;
}
.crumb{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);letter-spacing:.3px;}
.crumb b{color:var(--text-dim);font-weight:500;}
.page-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin-top:1px;}
.top-right{display:flex;align-items:center;gap:16px;}
.badge{
  font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:5px;
  border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;gap:6px;
}
.badge.good{border-color:rgba(183,226,74,.3);color:var(--accent);}

.content{padding:28px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

h1.h{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:2px;}
.section-lede{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}

/* ---------- Grid / Cards ---------- */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;
}
.card-tight{padding:14px 16px;}
.stat-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;}
.stat-value{font-family:var(--font-display);font-size:26px;font-weight:600;}
.stat-sub{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

/* ---------- Buttons ---------- */
.btn{
  font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;border:1px solid var(--border);
  color:var(--text-dim);transition:all .12s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--text-faint);color:var(--text);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#0E1206;font-weight:600;}
.btn-primary:hover{background:#c7f166;border-color:#c7f166;color:#0E1206;}
.btn-ghost{border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:11.5px;}

/* ---------- Status dots / badges ---------- */
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;}
.status .d{width:6px;height:6px;border-radius:50%;}
.status.loaded .d{background:var(--accent);}
.status.available .d{background:var(--text-faint);border:1px solid var(--text-dim);background:transparent;}
.status.notinstalled .d{background:var(--text-faint);opacity:.4;}
.status.loaded{color:var(--accent);}
.status.available{color:var(--text-dim);}
.status.notinstalled{color:var(--text-faint);}

.tag{
  font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:4px;
  background:var(--surface-3);color:var(--text-dim);letter-spacing:.2px;
}

/* ---------- Overview ---------- */
.pulse-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:16px;}
.pulse-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.pulse-head .eyebrow{margin-bottom:0;}
.ask-row{
  margin-top:18px;display:flex;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:6px 6px 6px 14px;align-items:center;
}
.ask-row input{
  flex:1;background:none;border:none;color:var(--text);font-family:var(--font-body);font-size:13px;
}
.ask-row input::placeholder{color:var(--text-faint);}
.ask-row input:focus{outline:none;}

/* ---------- Model cards ---------- */
.model-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;
  cursor:pointer;transition:border-color .12s,transform .12s;
}
.model-card:hover{border-color:var(--accent-dim);}
.mc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.mc-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;}
.mc-tags{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 12px;}
.qbar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;color:var(--text-dim);}
.qbar{flex:1;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;}
.qbar-fill{height:100%;background:var(--accent);border-radius:3px;}
.mc-meta{display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:14px;}
.mc-foot{display:flex;justify-content:space-between;align-items:center;}

.filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.search-box{
  flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:8px 12px;display:flex;align-items:center;gap:8px;
}
.search-box input{background:none;border:none;color:var(--text);font-size:13px;flex:1;}
.search-box input:focus{outline:none;}
.search-box svg{width:14px;height:14px;color:var(--text-faint);flex-shrink:0;}
.chip{
  padding:7px 12px;border-radius:7px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);
  font-weight:500;white-space:nowrap;
}
.chip.active{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent);}

/* ---------- Back link ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;margin-bottom:16px;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:13px;height:13px;}

/* ---------- Detail layout ---------- */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.detail-title{font-family:var(--font-display);font-size:22px;font-weight:700;}
.detail-sub{color:var(--text-dim);font-size:13px;margin-top:4px;}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-faint);padding:0 10px 10px 0;font-weight:500;border-bottom:1px solid var(--border);
}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
tr:last-child td{border-bottom:none;}
.num{font-family:var(--font-mono);color:var(--text-dim);}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.kv:last-child{border-bottom:none;}
.kv span:first-child{color:var(--text-dim);}
.kv span:last-child{font-family:var(--font-mono);}

.details-toggle{
  margin-top:14px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
  display:flex;align-items:center;gap:6px;
}
.details-toggle:hover{color:var(--accent);}
.tech-panel{
  display:none;margin-top:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  padding:12px 14px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);line-height:1.8;
}
.tech-panel.open{display:block;}

/* ---------- Router trace (signature element) ---------- */
.trace-wrap{position:relative;overflow:hidden;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);padding:16px 20px 10px;}
.trace-wrap svg{width:100%;height:auto;display:block;}
.trace-dash{stroke-dasharray:5 6;animation:dashmove 1.4s linear infinite;}
@keyframes dashmove{to{stroke-dashoffset:-22;}}
.trace-pulse{animation:tracepulse 2.6s ease-in-out infinite;}
@keyframes tracepulse{0%,100%{opacity:.35;}50%{opacity:1;}}

.trace-log{margin-top:14px;display:flex;flex-direction:column;gap:0;}
.trace-row{
  display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--border-soft);font-size:12px;
}
.trace-row:last-child{border-bottom:none;}
.trace-time{font-family:var(--font-mono);color:var(--text-faint);font-size:10.5px;}
.trace-desc span{color:var(--text-dim);}
.trace-score{font-family:var(--font-mono);color:var(--accent);font-size:11px;}

/* ---------- Toggle switch ---------- */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.toggle-row:last-child{border-bottom:none;}
.toggle-label{font-size:13px;font-weight:500;}
.toggle-desc{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.switch{width:36px;height:20px;border-radius:10px;background:var(--surface-3);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .15s;}
.switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:var(--text-dim);top:2px;left:2px;transition:transform .15s,background .15s;}
.switch.on{background:var(--accent-glow);border-color:var(--accent-dim);}
.switch.on::after{transform:translateX(16px);background:var(--accent);}

/* ---------- Playground ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:12.5px;font-weight:500;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--accent);border-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}

.chat-frame{display:flex;flex-direction:column;height:460px;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;}
.chat-strategy{padding:10px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:72%;padding:10px 13px;border-radius:9px;font-size:13px;line-height:1.55;}
.msg.user{align-self:flex-end;background:var(--accent-glow);color:var(--text);border:1px solid var(--accent-dim);border-bottom-right-radius:3px;}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:3px;}
.msg-meta{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:5px;}
.chat-input-row{border-top:1px solid var(--border-soft);padding:10px;display:flex;gap:8px;}
.chat-input-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;}
.chat-input-row input:focus{outline:none;border-color:var(--accent-dim);}

/* ---------- Employees ---------- */
.emp-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;}
.emp-card:hover{border-color:var(--accent-dim);}
.emp-icon{width:34px;height:34px;border-radius:8px;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.emp-icon svg{width:17px;height:17px;color:var(--accent);}
.emp-name{font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:2px;}
.emp-role{font-size:12px;color:var(--text-dim);margin-bottom:14px;}
.pill-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}

.list-plain{display:flex;flex-direction:column;}
.list-plain li{list-style:none;display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.list-plain li:last-child{border-bottom:none;}

/* ---------- Workflows ---------- */
.wf-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.wf-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.wf-name{font-family:var(--font-display);font-weight:600;font-size:14px;}
.wf-trigger{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:2px;}
.wf-steps{display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.wf-step{
  font-size:11.5px;padding:6px 11px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-dim);white-space:nowrap;
}
.wf-arrow{color:var(--text-faint);padding:0 8px;font-size:12px;flex-shrink:0;}

/* ---------- Activity ---------- */
.act-row{display:grid;grid-template-columns:90px 100px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.act-row:last-child{border-bottom:none;}
.act-time{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
.act-desc{font-size:12.5px;}
.act-desc b{font-weight:600;}
.act-detail{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

/* ---------- System ---------- */
.usage-bar{height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin:8px 0 4px;}
.usage-fill{height:100%;background:var(--accent);}
.engine-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.engine-row:last-child{border-bottom:none;}
.engine-name{font-weight:500;font-size:13px;}
.engine-desc{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">alamia</div>
        <div class="brand-sub">local ai</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="health-row"><span class="dot pulse"></span> Runtime healthy</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">ALAMIA</div>
        <div class="page-title" id="pageTitle">Overview</div>
      </div>
      <div class="top-right">
        <div class="badge good"><span class="dot pulse" style="width:5px;height:5px;"></span> 3 models loaded</div>
        <div class="badge">24.1 GB / 64 GB RAM</div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
/* ============================= ICONS ============================= */
const ICONS = {
  grid:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  layers:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>`,
  route:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.3"/><circle cx="19" cy="18" r="2.3"/><circle cx="19" cy="6" r="2.3"/><path d="M7.3 6h9.4M8 7.6 17 16.4"/></svg>`,
  terminal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>`,
  users:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="18" cy="8.5" r="2.4"/><path d="M16.5 14.2c2.7.4 4.5 2.4 4.5 5.3"/></svg>`,
  workflow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.3"/><rect x="15" y="15" width="6" height="6" rx="1.3"/><path d="M9 6h4a3 3 0 0 1 3 3v6"/></svg>`,
  activity:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7L14 19l2.5-7H21"/></svg>`,

/* ---- Model Garden ---- */
function modelCardHTML(m){
  const statusClass = m.status==='loaded'?'loaded':m.status==='available'?'available':'notinstalled';
  const statusLabel = m.status==='loaded'?'Loaded':m.status==='available'?'Ready to load':'Not installed';
  const actionBtn = m.status==='loaded' ? `<button class="btn btn-sm" data-unload="${m.id}">Unload</button>`
    : m.status==='available' ? `<button class="btn btn-primary btn-sm" data-load="${m.id}">Load</button>`
    : `<button class="btn btn-primary btn-sm" data-install="${m.id}">Install</button>`;
  return `
    <div class="model-card" data-model="${m.id}">
      <div class="mc-head">
        <div>
          <div class="mc-name">${m.name}</div>
        </div>
        <div class="status ${statusClass}"><span class="d"></span>${statusLabel}</div>
      </div>
      <div class="mc-tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="qbar-row"><span>Quality</span><div class="qbar"><div class="qbar-fill" style="width:${m.quality/5*100}%"></div></div><span>${m.quality.toFixed(1)}</span></div>
      <div class="mc-meta"><span>RAM ${m.ram} GB</span><span>${m.speed} tok/s</span></div>
      <div class="mc-foot">
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);">${m.engine}</span>
        ${actionBtn}
      </div>
    </div>`;
}

function renderGarden(c){
  setCrumb('ALAMIA / MODEL GARDEN','Model Garden');
  const cats = ['All','Generation','Embedding','Reasoning','Coding'];
  const catMap = {Generation:['Extraction','RAG'], Reasoning:['Reasoning'], Coding:['Coding'], Embedding:['Embedding','Reranking']};
  let filtered = MODELS.filter(m=>{
    const matchesQuery = m.name.toLowerCase().includes(state.gardenQuery.toLowerCase());
    const matchesCat = state.gardenFilter==='All' || m.tags.some(t=>(catMap[state.gardenFilter]||[]).includes(t));
    return matchesQuery && matchesCat;
  });
  c.innerHTML = `
    <div class="section-lede">Discover, compare, and manage the models running on this machine. Everything here runs locally on your CPU.</div>
    <div class="filter-row">
      <div class="search-box">${icon('search')}<input id="gardenSearch" type="text" placeholder="Search models..." value="${state.gardenQuery}"/></div>
      ${cats.map(cat=>`<button class="chip ${state.gardenFilter===cat?'active':''}" data-cat="${cat}">${cat}</button>`).join('')}
    </div>
    <div class="grid grid-3" id="gardenGrid">
      ${filtered.map(modelCardHTML).join('') || `<div class="card" style="grid-column:1/-1;color:var(--text-dim);">No models match that search.</div>`}
    </div>
  `;
  c.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.gardenFilter=el.dataset.cat; renderGarden(c);});
  const search = document.getElementById('gardenSearch');
  search.oninput = ()=>{state.gardenQuery = search.value; renderGarden(c); document.getElementById('gardenSearch').focus();};
  bindModelCards(c);
}

function bindModelCards(root){
  root.querySelectorAll('[data-model]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      navigate('model-detail', el.dataset.model);
    });
  });
  root.querySelectorAll('[data-install],[data-load],[data-unload]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.install||btn.dataset.load||btn.dataset.unload;
      const m = MODELS.find(x=>x.id===id);
      if(btn.dataset.install){ m.status='available'; btn.textContent='Installing\u2026'; setTimeout(()=>render(),650); }
      if(btn.dataset.load){ m.status='loaded'; render(); }
      if(btn.dataset.unload){ m.status='available'; render(); }
    });
  });
  root.querySelectorAll('[data-nav]').forEach(el=>{ if(!el.onclick) el.onclick=()=>navigate(el.dataset.nav); });
}
function bindLocalNav(root){
  root.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick=()=>navigate(el.dataset.nav); });
}

          <button class="details-toggle" id="stratToggle" style="margin-top:0;">${icon('chevron')} Technical view</button>
        </div>
        <div class="tech-panel" id="stratPanel" style="margin:0;border-radius:0;border-left:none;border-right:none;">selected_model = Qwen 2.5 1.5B &nbsp; via LlamaCppBackend &nbsp; (score 0.94, RAG capability match)</div>
        <div class="chat-body">
          <div class="msg user">Summarize the attached Q3 report in three bullet points.</div>
          <div class="msg ai">\u2022 Revenue up 12% quarter over quarter, driven by the local-AI product line.<br/>\u2022 Gross margin held steady at 61%.<br/>\u2022 Hiring plan for Q4 delayed pending runway review.<div class="msg-meta">Qwen 2.5 1.5B \u00b7 0.6s \u00b7 local</div></div>
          <div class="msg user">Turn that into a short email to the team.</div>
          <div class="msg ai">Draft ready \u2014 want me to open it in your AI Employee's Email tool?<div class="msg-meta">Qwen 2.5 1.5B \u00b7 0.4s \u00b7 local</div></div>
        </div>
        <div class="chat-input-row"><input type="text" placeholder="Ask anything\u2026"/><button class="btn btn-primary btn-sm">Send</button></div>
      </div>`;
    document.getElementById('stratToggle').onclick=()=>document.getElementById('stratPanel').classList.toggle('open');
  } else {
    body.innerHTML = `<div class="card" style="color:var(--text-dim);">
      <div class="eyebrow">${state.tab}</div>
      ${state.tab} workspace \u2014 pick a model or leave it on Automatic, drop in your input, and run it locally. Results and confidence scores appear inline.
      <div class="ask-row" style="margin-top:16px;"><input type="text" placeholder="Input for ${state.tab.toLowerCase()}\u2026"/><button class="btn btn-primary btn-sm">Run</button></div>
    </div>`;
  }
}

/* ---- Employees ---- */
function renderEmployees(c){
  setCrumb('ALAMIA / AI EMPLOYEES','AI Employees');
  c.innerHTML = `
    <div class="section-lede">Installed AI Employees \u2014 autonomous workers with their own tools, memory, and permissions.</div>
    <div class="grid grid-3">
      ${EMPLOYEES.map(e=>`
        <div class="emp-card" data-emp="${e.id}">
          <div class="emp-icon">${icon(e.icon)}</div>
          <div class="emp-name">${e.name}</div>
          <div class="emp-role">${e.role}</div>
          <div class="status loaded"><span class="d"></span>Ready</div>
        </div>`).join('')}
      <div class="emp-card" style="display:flex;align-items:center;justify-content:center;color:var(--text-faint);border-style:dashed;">+ Install an AI Employee</div>
    </div>
  `;
  bindLocalNav(c);
  c.querySelectorAll('[data-emp]').forEach(el=>el.onclick=()=>navigate('employee-detail', el.dataset.emp));
}

function renderEmployeeDetail(c){
  const e = EMPLOYEES.find(x=>x.id===state.employeeId) || EMPLOYEES[0];
  setCrumb('ALAMIA / AI EMPLOYEES / '+e.name.toUpperCase(), e.name);
  c.innerHTML = `
    <a class="back-link" data-nav="employees">${icon('back')} Back to AI Employees</a>
    <div class="detail-head">
      <div>
        <div class="detail-title">${e.name}</div>
        <div class="detail-sub">${e.role}</div>
      </div>
      <button class="btn">Open</button>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="eyebrow">Permissions</div>
        <ul class="list-plain">
          ${e.permissions.map(p=>{
            const deny = p.includes('deny');
            return `<li><span>${p.replace(/\s*\((allow|deny|ask before send)\)/,'')}</span><span class="tag" style="${deny?'color:var(--danger);':p.includes('ask')?'color:var(--warn);':'color:var(--accent);'}">${p.match(/\((.*)\)/)?.[1]||'allow'}</span></li>`;
          }).join('')}
        </ul>
        <div class="eyebrow" style="margin-top:20px;">Workflows using this employee</div>
        <ul class="list-plain">
          ${e.workflows.map(w=>`<li><span>${w}</span><span class="tag">active</span></li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <div class="eyebrow">Configuration</div>
        <div class="kv"><span>Model strategy</span><span>Automatic</span></div>
        <div class="kv"><span>Memory</span><span>${e.memory}</span></div>
        <div class="kv"><span>Tools</span><span>${e.tools.join(', ')}</span></div>
        <div class="kv"><span>Status</span><span class="status loaded"><span class="d"></span>Ready</span></div>
      </div>
    </div>
  `;
  bindLocalNav(c);
}

/* ---- Workflows ---- */
function renderWorkflows(c){
  setCrumb('ALAMIA / WORKFLOWS','Workflows');
  c.innerHTML = `
    <div class="section-lede">Automation pipelines your AI Employees run on a schedule or trigger.</div>
    ${WORKFLOWS.map(w=>`
      <div class="wf-card">
        <div class="wf-head">
          <div>
            <div class="wf-name">${w.name}</div>
            <div class="wf-trigger">${w.trigger}</div>
          </div>
          <div class="status ${w.status==='active'?'loaded':'available'}"><span class="d"></span>${w.status==='active'?'Active':'Paused'}</div>
        </div>
        <div class="wf-steps">${w.steps.map((s,i)=>`<span class="wf-step">${s}</span>${i<w.steps.length-1?'<span class="wf-arrow">\u2192</span>':''}`).join('')}</div>
      </div>`).join('')}
    <button class="btn btn-primary" style="margin-top:6px;">+ New workflow</button>
  `;
  bindLocalNav(c);
}

/* ---- Activity ---- */
function renderActivityPage(c){
  setCrumb('ALAMIA / ACTIVITY','Activity');
  c.innerHTML = `
    <div class="section-lede">Every router decision, model load, tool call, and workflow run \u2014 recorded locally.</div>
    <div class="card">
      ${ACTIVITY.map(a=>`
        <div class="act-row">
          <div class="act-time">${a.t}</div>
          <div class="tag">${a.kind}</div>
          <div class="act-desc">${a.desc}</div>
          <div class="act-detail">${a.meta}</div>
        </div>`).join('')}
    </div>
  `;
  bindLocalNav(c);
}

function renderSystem(c){
  setCrumb('ALAMIA / SYSTEM','System');
  c.innerHTML = `
    <div class="two-col">
      <div>
        <div class="card" style="margin-bottom:16px;">
          <div class="eyebrow">Hardware</div>
          <div class="kv"><span>CPU</span><span>8-core / AVX2, AVX-512</span></div>
          <div class="kv"><span>RAM</span><span>24.1 GB / 64 GB used</span></div>
          <div class="usage-bar"><div class="usage-fill" style="width:38%;"></div></div>
          <div class="flags">
            <span class="tag" style="color:var(--accent);">AVX2 \u2713</span>
            <span class="tag" style="color:var(--accent);">AVX-512 \u2713</span>
            <span class="tag" style="color:var(--text-faint);">NEON \u2014</span>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px;">
          <div class="eyebrow">Storage</div>
          <div class="kv"><span>Model directory</span><span>./models/</span></div>
          <div class="kv"><span>Disk used by models</span><span>5.4 GB of 40 GB quota</span></div>
          <div class="usage-bar"><div class="usage-fill" style="width:14%;"></div></div>
          ${MODELS.filter(m=>m.status!=='not-installed').map(m=>`<div class="kv"><span>${m.name}</span><span>${(m.ram*0.9).toFixed(1)} GB</span></div>`).join('')}
        </div>

        <div class="card">
          <div class="eyebrow">Engines</div>
          <div class="engine-row"><div><div class="engine-name">Generation Engine</div><div class="engine-desc">llama.cpp \u2014 Qwen, Phi, Gemma</div></div><div class="status loaded"><span class="d"></span>Running</div></div>
          <div class="engine-row"><div><div class="engine-name">1-bit Engine</div><div class="engine-desc">BitNet ternary sidecar</div></div><div class="status loaded"><span class="d"></span>Running</div></div>
          <div class="engine-row"><div><div class="engine-name">Embeddings Engine</div><div class="engine-desc">Hugging Face TEI</div></div><div style="display:flex;align-items:center;gap:10px;"><div class="status notinstalled"><span class="d"></span>Stopped</div><button class="btn btn-sm">Start</button></div></div>
        </div>
      </div>

      <div class="card">
        <div class="eyebrow">Network & privacy</div>
        <div class="toggle-row"><div><div class="toggle-label">Local-only mode</div><div class="toggle-desc">Block all outbound network calls</div></div><div class="switch on"></div></div>
        <div class="toggle-row"><div><div class="toggle-label">Cloud escalation</div><div class="toggle-desc">Allow Router to reach cloud models when needed</div></div><div class="switch"></div></div>
        <div class="toggle-row"><div><div class="toggle-label">Anonymous usage telemetry</div><div class="toggle-desc">Help improve Alamia \u2014 no content ever leaves this device</div></div><div class="switch"></div></div>

        <div class="eyebrow" style="margin-top:22px;">Configuration</div>
        <button class="details-toggle" id="cfgToggle">${icon('chevron')} Workspace & paths</button>
        <div class="tech-panel" id="cfgPanel">
          workspace.dir &nbsp;= ~/alamia/workspace<br/>
          models.dir &nbsp;&nbsp;&nbsp;&nbsp;= ~/alamia/models<br/>
          data.dir &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= ~/alamia/data<br/>
          runtime.mode &nbsp;= local-first
        </div>
      </div>
    </div>
  `;
  c.querySelectorAll('.switch').forEach(sw=>sw.onclick=()=>sw.classList.toggle('on'));

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
