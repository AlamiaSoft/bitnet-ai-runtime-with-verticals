services:
  alamia-local-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alamia-local-ai
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./workspace:/app/workspace
      - ./bitnet_runtime:/app/bitnet_runtime
      - ./verticals:/app/verticals
    env_file:
      - .env
    environment:
      - BITNET_HOST=0.0.0.0
      - BITNET_PORT=8000
      - BITNET_SERVER_URL=${BITNET_SERVER_URL:-http://bitnet-runtime:11434/v1}
      - BITNET_LOCAL_ENDPOINT_URL=${BITNET_LOCAL_ENDPOINT_URL:-http://bitnet-runtime:11434/v1}
      - BITNET_API_KEY=${BITNET_API_KEY:-51129693340}
      - ALAMIA_RUNTIME_NAME=Alamia Local AI Runtime
      - ENVIRONMENT=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - bitnet-runtime

  bitnet-runtime:
    image: mcr.microsoft.com/appsvc/docs/sidecars/sample-experiment:bitnet-b1.58-2b-4t-gguf
    container_name: bitnet-server
    restart: unless-stopped
    ports:
      - "${BITNET_HOST_PORT:-8080}:11434"
    environment:
      - SLM_PORT=11434
      - WEBSITE_SLM_STARTUP_ARGUMENTS=-t ${BITNET_THREADS:-4} --repeat-penalty ${BITNET_REPEAT_PENALTY:-1.15} --repeat-last-n 64 --top-p ${BITNET_TOP_P:-0.9} --min-p ${BITNET_MIN_P:-0.05} --temp ${BITNET_TEMP:-0.7} -c ${BITNET_CTX_SIZE:-4096} --parallel ${BITNET_PARALLEL:-2}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:11434/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

