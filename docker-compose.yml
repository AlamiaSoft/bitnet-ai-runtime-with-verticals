services:
  alamia-local-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alamia-local-ai
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./workspace:/app/workspace
      - ./bitnet_runtime:/app/bitnet_runtime
      - ./verticals:/app/verticals
    env_file:
      - .env
    environment:
      - BITNET_HOST=0.0.0.0
      - BITNET_PORT=8000
      - BITNET_SERVER_URL=${BITNET_SERVER_URL:-https://ai.alamiaconnect.com/v1}
      - BITNET_API_KEY=${BITNET_API_KEY:-51129693340}
      - ALAMIA_RUNTIME_NAME=Alamia Local AI Runtime
      - ENVIRONMENT=production
    restart: unless-stopped

